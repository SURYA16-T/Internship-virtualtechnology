<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="websiteclock.css">
    <title>animation-clock</title>
</head>
<title>Retro clock - Bedimcode</title>
<body>
    <div class="container">
        <div class="clock">
            <div class="clock__circle">
                <div class="clock__rounder"></div>
                <div class="clock__hour" id="clock-hour"></div>
                <div class="clock__minutes" id="clock-minutes"></div>
                <div class="clock__seconds" id="clock-seconds"></div>
            </div>
            <div class="clock_date">
                <span class="clock_day-week" id="date-day-week"></span>
                <div>
                    <span class="clock_day" id="date-day"></span>
                    <span class="clock_month" id="date-month"></span>
                    <span class="clock_year" id="date-year"></span>
                </div>
            </div>
            <div class="clock_text">
                <span class="clock_text-hour" id="text-hour"></span>
                <span class="clock_text-minute" id="text-minutes"></span>
                <span class="clock_text-second" id="text-seconds"></span>
                <span class="clock_text-ampm" id="text-ampm"></span>
            </div>
        </div>
    </div>
    </div>
    <script src="websiteclock.js"></script>

</body>

</html>
